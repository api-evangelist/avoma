                  type: string
                subject:
                  description: The subject of the meeting.
                  type: string
                uuid:
                  description: The unique identifier of the event.
                  format: uuid
                  type: string
              type: object
      responses:
        '200':
          description: 'Your endpoint should return any 2xx status to acknowledge receipt. Non-2xx responses trigger the retry policy.

            '
      summary: 'Event payload: MEETING_BOOKED_VIA_SCHEDULER'
