  /v1/webhooks/signing-secret/:
    delete:
      description: Removes the signing secret. After this call, outbound deliveries will no longer include an `X-Avoma-Signature` header.
      operationId: clearWebhookSigningSecret
      responses:
        '204':
          description: Secret cleared.
        '401':
          content:
            application/json:
              schema:
                properties:
                  detail:
                    description: Error details
                    example: Not Found
                    type: string
                required:
                - detail
                type: object
          description: Unauthorized
      summary: Clear Webhook Signing Secret
      tags:
      - Webhooks
    get:
      description: Returns the current signing secret for your organization's webhooks. The secret is used to generate the `X-Avoma-Signature` header on outbound webhook deliveries. If no secret is configured, an empty string is returned and deliveries will not include the signature header.
      operationId: getWebhookSigningSecret
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  signing_secret:
                    description: 'HMAC signing secret used to sign outbound webhook payloads. An empty string means no secret is configured and deliveries will not include the `X-Avoma-Signature` header.

                      '
                    example: a3f8e1c0d2b4...
                    type: string
                required:
                - signing_secret
                type: object
          description: OK
        '401':
          content:
            application/json:
              schema:
                properties:
                  detail:
                    description: Error details
                    example: Not Found
                    type: string
                required:
                - detail
                type: object
          description: Unauthorized
      summary: Get Webhook Signing Secret
      tags:
      - Webhooks
    patch:
      description: Set a custom signing secret for your organization's webhooks. After this call, all outbound deliveries will include an `X-Avoma-Signature` HMAC-SHA256 header computed from this secret.
      operationId: setWebhookSigningSecret
      requestBody:
        content:
          application/json:
            schema:
              properties:
                signing_secret:
                  description: 'HMAC signing secret used to sign outbound webhook payloads. An empty string means no secret is configured and deliveries will not include the `X-Avoma-Signature` header.

                    '
                  example: a3f8e1c0d2b4...
                  type: string
              required:
              - signing_secret
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  signing_secret:
                    description: 'HMAC signing secret used to sign outbound webhook payloads. An empty string means no secret is configured and deliveries will not include the `X-Avoma-Signature` header.

                      '
                    example: a3f8e1c0d2b4...
                    type: string
                required:
                - signing_secret
                type: object
          description: OK
        '400':
          content:
            application/json:
              schema:
                properties:
                  detail:
                    description: Error details
                    example: Not Found
                    type: string
                required:
                - detail
                type: object
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                properties:
                  detail:
                    description: Error details
                    example: Not Found
                    type: string
                required:
                - detail
                type: object
          description: Unauthorized
      summary: Set Webhook Signing Secret
      tags:
      - Webhooks
  /v1/webhooks/signing-secret/rotate/:
    post:
      description: Generates a new cryptographically random 64-character hex signing secret, replacing any existing one. Use this to rotate your secret without downtime — update your receiver first, then rotate.
      operationId: rotateWebhookSigningSecret
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  signing_secret:
                    description: 'HMAC signing secret used to sign outbound webhook payloads. An empty string means no secret is configured and deliveries will not include the `X-Avoma-Signature` header.

                      '
                    example: a3f8e1c0d2b4...
                    type: string
                required:
                - signing_secret
                type: object
          description: New secret generated.
        '401':
          content:
            application/json:
              schema:
                properties:
                  detail:
                    description: Error details
                    example: Not Found
                    type: string
                required:
                - detail
                type: object
          description: Unauthorized
      summary: Rotate Webhook Signing Secret
      tags:
      - Webhooks
  /v1/webhooks/{uuid}/:
    delete:
      description: Deactivates a webhook subscription. No further events will be delivered to the associated `target_url`. The subscription is soft-deleted (`is_active` set to `false`) — it is not permanently removed.
      operationId: deleteWebhook
      parameters:
      - description: UUID of the webhook subscription to deactivate.
        in: path
        name: uuid
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '204':
          description: No Content — subscription deactivated.
        '401':
          content:
            application/json:
              schema:
                properties:
                  detail:
                    description: Error details
                    example: Not Found
                    type: string
                required:
                - detail
                type: object
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                properties:
                  detail:
                    description: Error details
                    example: Not Found
                    type: string
                required:
                - detail
                type: object
          description: Not Found
      summary: Delete (Deactivate) Webhook Subscription
      tags:
      - Webhooks
