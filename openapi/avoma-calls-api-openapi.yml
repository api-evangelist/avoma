    patch:
      summary: Update Call
      description: Updates call fields that are allowed after meeting processing is complete. Only allows updating call-specific metadata fields.
      tags:
      - Calls
      parameters:
      - name: external_id
        required: true
        in: path
        schema:
          type: string
          description: External ID of the call to update
      requestBody:
        content:
          application/json:
            schema:
              $ref: ./openapi/components/external.yml#/components/schemas/patch_call_request
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ./openapi/components/external.yml#/components/schemas/call_response
          description: Call updated successfully
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: ./openapi/components/external.yml#/components/schemas/bad_request_body
        '404':
          description: Call not found
          content:
            application/json:
              schema:
                $ref: ./openapi/components/external.yml#/components/schemas/http_error_response
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: ./openapi/components/external.yml#/components/schemas/http_error_response
      operationId: patchV1CallsByExternalId
      x-operation-id-source: derived
