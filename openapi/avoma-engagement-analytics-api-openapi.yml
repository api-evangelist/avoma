  /v1/engagement/{user_uuid}/summary/:
    get:
      summary: Get Engagement Summary for Specific User's Participants
      description: Returns aggregated summary statistics for a specific user's engagement activity across all their participants. Shows how the user engaged with different participants.
      tags:
      - Engagement Analytics
      parameters:
      - name: user_uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: UUID of the user to get participant summary for
      - name: from_date
        in: query
        required: true
        schema:
          type: string
          format: date-time
        description: 'To retrieve engagement summary for meetings started at or started after given date-time(UTC). Format: ISO 8601 datetime string e.g. "2024-01-01T00:00:00Z".'
      - name: to_date
        in: query
        required: true
