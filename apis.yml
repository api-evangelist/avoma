description: Avoma is an AI-powered meeting assistant platform that automates note‑taking, scheduling, and coaching for sales and revenue teams.
  It records and transcribes meetings in real time, generates structured summaries, pushes data to CRMs, and provides AI‑driven sales coaching
  and guidance. The platform also offers lead routing, meeting reminders, and revenue intelligence tools to help organizations improve productivity
  and close deals faster.

