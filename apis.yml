- aid: avoma:avoma-webhooks-api
  name: Avoma Webhooks API
  description: "**Webhooks**\n\nAvoma Webhooks notify users about the successful occurrence of events\
    \ within the Avoma application. Instead of polling or calling APIs to detect events, Avoma sends webhook\
    \ events as HTTP POST requests, with a JSON payload, to your specified endpoint URL.\n\n**Subscribing\
    \ to Webhooks**\n\nTo subscribe to webhooks, please reach out to Avoma support and provide a public\
    \ HTTPS endpoint URL. The URL must be secure (HTTPS). Your endpoint should respond with an HTTP **200**\
    \ status code to acknowledge receipt of the webhook data. If no response or an error is returned,\
    \ Avoma will retry the connection up to five times within 24 hours. To avoid retries and errors, always\
    \ acknowledge the receipt of webhooks by responding with HTTP **200**.\n\nIf persistent non-success\
    \ responses are received more than five times in the last 24 hours, Avoma will unsubscribe your webhooks.\
    \ \n\n**Supported event types**\n\n| `event_type` | Fires when |\n|---|---|\n| `AINOTE` | AI notes\
    \ are ready for a meeting or call. |\n| `MEETING_BOOKED_VIA_SCHEDULER` | A meeting is booked via an\
    \ Avoma scheduling page. |\n| `MEETING_BOOKED_VIA_SCHEDULER_RESCHEDULED` | A scheduler-booked meeting\
    \ is rescheduled. |\n| `MEETING_BOOKED_VIA_SCHEDULER_CANCELED` | A scheduler-booked meeting is canceled.\
    \ |\n| `new_conversation` | AI notes ready (Zapier only). |\n\n**Retry policy**\n\nFailed deliveries\
    \ (non-2xx or timeout) are retried up to 5 times with\nincreasing delays: 5 min → 30 min → 2 h → 12\
    \ h → 24 h. After 5 consecutive\nfailures the subscription is automatically deactivated.\n\n**Signature\
    \ verification**\n\nWhen a signing secret is configured, every delivery includes an\n`X-Avoma-Signature`\
    \ header — an HMAC-SHA256 hex digest of the raw request\nbody.\n\nTo verify the signature:\n\n1. Retrieve\
    \ the payload from the received webhook event.\n2. Obtain your Avoma API secret key (provided when\
    \ you requested API/Webhooks access).\n3. Compute the HMAC using the payload and your secret key,\
    \ using the SHA256 digest algorithm.\n4. Convert the result to a hexadecimal format.\n5. Compare the\
    \ computed value to the value in the `X-Avoma-Signature` header. If they match, the webhook is from\
    \ Avoma.\n\n**Sample Code for Webhook Verification**\n\n*Node.js:*\n\n```javascript\nconst crypto\
    \ = require('crypto');\nconst message = `${JSON.stringify(request.body)}`;\nconst hashForVerify =\
    \ crypto.createHmac('sha256', AVOMA_API_KEY).update(message).digest('hex');\nconst signature = `${hashForVerify}`;\n\
    \nif (request.headers['x-avoma-signature'] === signature) {\n  // Webhook request came from Avoma\n\
    } else {\n  // Webhook request did not come from Avoma\n}\n```\n\n*Python:*\n\n```python\nimport hashlib\n\
    import hmac\nimport json\n\nrequest = \"YOUR WEBHOOK REQUEST\"\nsecret_key = \"YOUR_SECRET_KEY\"\n\
    body_unicode = request.body.decode(\"utf-8\")\n\nh = hmac.new(secret_key.encode('utf-8'), body_unicode.encode('utf-8'),\
    \ hashlib.sha256)\n\n# Compare the computed signature with the signature from the request\n\nlowercase_headers\
    \ = {key.lower(): value for key, value in request.headers.items()}\n\nwebhook_signature = lowercase_headers.get('x-avoma-signature')\n\
    \nif webhook_signature != h.hexdigest():\n    print(\"Webhook signature does not match\")\n```\n.\
    \ Manage your signing secret via `GET/PATCH/DELETE /v1/webhooks/signing-secret/`\nor rotate it via\
    \ `POST /v1/webhooks/signing-secret/rotate/`."
  humanURL: https://dev.avoma.com/
  baseURL: https://api.avoma.com
  tags:
  - Webhook
  tags_raw:
  - Webhooks
  properties:
  - type: OpenAPI
    url: openapi/avoma-webhooks-api-openapi.yml
